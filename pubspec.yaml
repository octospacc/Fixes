name: Fixes
description: "A small, local-first consumption tracker for everyday countable things."
publish_to: 'none'
version: 1.2.8+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^8.1.0
  shared_preferences: ^2.3.0
  intl: ^0.20.3
  csv: ^6.0.0
  file_selector: ^1.0.3
  share_plus: ^10.0.0
  uuid: ^4.4.0
  fl_chart: ^0.68.0
  collection: ^1.18.0
  http: ^1.2.0
  crypto: ^3.0.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1B1D24"
    theme_color: "#E8A93C"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1B1D24"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true